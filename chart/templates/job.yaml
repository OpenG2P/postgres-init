{{- range .Values.databases }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* Job name must stay <= 63 chars: k8s copies it into the auto-generated
         `job-name` pod-template label, whose VALUE is capped at 63. fullname +
         db-name can exceed that (e.g. long release names repeated in both), so
         truncate. */}}
  name: {{ printf "%s-%s" (include "postgres-init.fullname" $) (tpl .name $ | replace "_" "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "postgres-init.labels" $ | nindent 4 }}
  annotations:
    {{- toYaml $.Values.job.annotations | nindent 4 }}
spec:
  backoffLimit: {{ $.Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ $.Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "postgres-init.selectorLabels" $ | nindent 8 }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postgres-init.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}-{{ tpl .name $ | replace "_" "-" }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: {{ tpl $.Values.postgresql.host $ | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgresql.port | quote }}
            - name: POSTGRES_USER
              value: {{ $.Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $.Values.postgresql.existingSecret $ }}
                  key: {{ tpl $.Values.postgresql.existingSecretPostgresPasswordKey $ }}

            - name: DB_NAME
              value: {{ tpl .name $ | quote }}
            - name: DB_USER
              value: {{ tpl .user $ | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .secret $ | quote }}
                  key: {{ tpl .secretUserPasswordKey $ | quote }}
            - name: DB_EXTENSIONS
              value: {{ if .extensions }}{{ if kindIs "slice" .extensions }}{{ join "," .extensions | quote }}{{ else }}{{ .extensions | quote }}{{ end }}{{ else }}""{{ end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
