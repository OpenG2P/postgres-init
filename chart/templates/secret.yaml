{{- if not .Values.database.password -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (tpl .Values.database.secret .) }}
{{- if not $secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .Values.database.secret . | quote }}
  labels:
    {{- include "postgres-init.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ tpl .Values.database.secretUserPasswordKey . | quote }}: {{ randAlphaNum 10 | b64enc | quote }}
{{- end -}}
{{- end -}}

