{{- if not .Values.database.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secret }}
  labels:
    {{- include "postgres-init.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ tpl .Values.database.secretUserPasswordKey . | quote }}: {{ randAlphaNum 10 | b64enc | quote }}
{{- end -}}

