# Default values for postgres-init.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: openg2p/postgres-init
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- PostgreSQL connection settings
# These values are used to connect to the existing PostgreSQL server.
postgresql:
  host: "commons-postgresql"
  port: 5432
  # -- Existing secret with PostgreSQL superuser credentials
  user: postgres
  existingSecret: commons-postgresql
  existingSecretPostgresPasswordKey: "postgres-password" 

# -- New database and user settings
# A list of databases to be created.
databases:
  - name: your_db
    user: your_db_user
    # Generated randomly in secrets.yaml. Don't assign it here
    password: ""
    secret: 'your-user-secret'
    secretUserPasswordKey: 'your-user-password-key'
    # List of extensions to install (comma-separated or list). Example
    # - 'pg_trgm'
    extensions: [] 

# -- Kubernetes Job settings
job:
  # -- Annotations to add to the Job.
  #
  # Default: NONE — the Job is a plain regular resource.
  #
  # Do NOT make this a Helm install/upgrade hook when PostgreSQL is deployed
  # in the SAME release (the common embedded-PG case). Both hook phases break:
  #   - pre-install/pre-upgrade runs BEFORE PostgreSQL and its superuser
  #     secret exist -> the Job fails ("secret not found", no DB to reach).
  #   - post-install/post-upgrade runs only AFTER all regular resources are
  #     Ready (helm --wait). Apps that need these databases (e.g. Keycloak)
  #     can never become Ready until the DBs exist, so the hook never fires
  #     -> DEADLOCK.
  # As a regular resource the Job has no such gate: it runs alongside
  # everything, waits for PostgreSQL via its built-in pg_isready loop, creates
  # the DBs/users, and dependent apps retry until those appear.
  #
  # (The "jobs.batch already exists" reinstall collision that motivated the
  # earlier hook experiment is better handled by ttlSecondsAfterFinished
  # and/or deleting the completed Job before reinstall — not by gating the
  # Job behind a hook phase.)
  annotations: {}
  # -- How many times to retry the Job before marking it as failed
  backoffLimit: 4
  # -- Time-to-live seconds after the Job finishes
  ttlSecondsAfterFinished: 100

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account.
  # Keep empty: the Job is a regular resource (see job.annotations), so its
  # ServiceAccount is created in the same wave and needs no hook ordering.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
