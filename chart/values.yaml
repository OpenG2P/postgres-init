# Default values for postgres-init.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: openg2p/postgres-init
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "develop"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- PostgreSQL connection settings
# These values are used to connect to the existing PostgreSQL server.
postgresql:
  host: "commons-postgresql"
  port: 5432
  # -- Existing secret with PostgreSQL superuser credentials
  user: postgres
  existingSecret: commons-postgresql
  existingSecretPostgresPasswordKey: "postgres-password" 

# -- New database and user settings
# A list of databases to be created.
databases:
  - name: your_db
    user: your_db_user
    # Generated randomly in secrets.yaml. Don't assign it here
    password: ""
    secret: 'your-user-secret'
    secretUserPasswordKey: 'your-user-password-key'
    # List of extensions to install (comma-separated or list). Example
    # - 'pg_trgm'
    extensions: [] 

# -- Kubernetes Job settings
job:
  # -- Annotations to add to the Job.
  #
  # Defaults make the Job a Helm pre-install/pre-upgrade hook with the
  # `before-hook-creation` delete policy. This is the structural fix for the
  # well-known "jobs.batch <name> already exists" failure that blocked
  # reinstalls when a leftover Job from a previous attempt was still in the
  # namespace. With `before-hook-creation`, Helm deletes the previous Job
  # before creating the new one — so reinstalls always succeed.
  #
  # `hook-weight: "1"` orders the Job after the DB-password Secret hook
  # (which has the default weight 0), so the secret exists before the Job
  # tries to mount it.
  #
  # Override to `{}` (or any custom set) if you need the Job to be a regular
  # release resource (e.g. for `helm get manifest` visibility) — but be
  # aware reinstall collisions can re-surface in that case.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
  # -- How many times to retry the Job before marking it as failed
  backoffLimit: 4
  # -- Time-to-live seconds after the Job finishes
  ttlSecondsAfterFinished: 100

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
